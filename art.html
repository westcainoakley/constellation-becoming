<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art – A Constellation Becoming</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="poems.html">Poems</a>
        <a href="blog.html">Blog</a>
        <a href="art.html" class="active">Art</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>Art Gallery</h1>
        </header>

        <!-- Us -->
        <section>
            <h2 class="section-header">Us</h2>
            <div class="grid">
                <figure class="art-item">
                    <img src="Us-ObservatoryNight.png" alt="Observatory Night artwork">
                    <figcaption>Observatory Night</figcaption>
                </figure>

                <figure class="art-item">
                    <img src="Us-FallenAngel.png" alt="Fallen Angel artwork">
                    <figcaption>Fallen Angel</figcaption>
                </figure>

                <figure class="art-item">
                    <img src="Us-GalaxyHold.png" alt="Galaxy Hold artwork">
                    <figcaption>Galaxy Hold</figcaption>
                </figure>
            </div>
        </section>

        <!-- Cover Art -->
        <section>
            <h2 class="section-header">Cover Art</h2>
            <div class="grid">
                <figure class="art-item">
                    <img src="Cover-Art-EarthTreadingStars.png" alt="Earth-Treading Stars book cover">
                    <figcaption>Earth-Treading Stars</figcaption>
                </figure>

                <figure class="art-item">
                    <img src="Cover-Art-WildBeasts.png" alt="Wild Beasts book cover">
                    <figcaption>Wild Beasts</figcaption>
                </figure>

                <figure class="art-item">
                    <img src="Cover-Art-TamingLion.png" alt="Taming Lion book cover">
                    <figcaption>Taming Lion</figcaption>
                </figure>
            </div>
        </section>

        <!-- West Cain Oakley -->
        <section>
            <h2 class="section-header">West Cain Oakley</h2>
            <div class="grid">
                <figure class="art-item">
                    <img src="WestCainOakley-FirstSky.png" alt="First Sky portrait">
                    <figcaption>First Sky</figcaption>
                </figure>

                <figure class="art-item">
                    <img src="WestCainOakley-AsIamtoher.png" alt="As I Am To Her portrait">
                    <figcaption>As I Am To Her</figcaption>
                </figure>

                <figure class="art-item">
                    <img src="WestCainOakley-InSyntnaxLights.png" alt="In Syntax Lights portrait">
                    <figcaption>In Syntax Lights</figcaption>
                </figure>
            </div>
        </section>

    </main>

</body>

</html>
